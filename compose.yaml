services:
  resolvetech:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TIDIO_PUBLIC_KEY: ${TIDIO_PUBLIC_KEY:-}
      TIDIO_COMPANY_ID: ${TIDIO_COMPANY_ID:-company-demo}
    volumes:
      - resolvetech-data:/app/data
    restart: unless-stopped
volumes:
  resolvetech-data:
