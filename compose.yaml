services:
  resolvetech:
    build:
      context: .
      args:
        GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_CALLS_APP_ID: ${CLOUDFLARE_CALLS_APP_ID:-}
      CLOUDFLARE_CALLS_APP_SECRET: ${CLOUDFLARE_CALLS_APP_SECRET:-}
    volumes:
      - resolvetech-data:/app/data
    restart: unless-stopped
volumes:
  resolvetech-data:
